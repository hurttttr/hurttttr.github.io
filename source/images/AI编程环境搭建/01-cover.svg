  <line x1="52" y1="176" x2="306" y2="176" stroke="#E2E8F0"/>

  <text x="52" y="202" font-size="12.5" fill="#334155">✓ 说清需求 → 直接交付文件（文档/表格/PPT）</text>
  <text x="52" y="228" font-size="12.5" fill="#334155">✓ 可读写本地文件夹，批量处理不喊累</text>
  <text x="52" y="254" font-size="12.5" fill="#334155">✓ 100+ 领域专家团并行协作</text>
  <text x="52" y="280" font-size="12.5" font-weight="700" fill="#2563EB">✓ 新人积分白送，轻度使用基本免费</text>

