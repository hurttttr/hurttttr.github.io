    <rect x="350" y="98" width="302" height="6" rx="3" fill="url(#gZc)"/>
  </g>
  <circle cx="392" cy="142" r="21" fill="url(#gZc)"/>
  <text x="392" y="150" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">Z</text>
  <text x="424" y="137" font-size="17" font-weight="700" fill="#0F172A">ZCode</text>
