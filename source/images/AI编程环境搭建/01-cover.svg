  <rect width="680" height="360" rx="18" fill="#F7F9FC"/>
  <text x="340" y="48" text-anchor="middle" font-size="25" font-weight="700" fill="#0F172A">WorkBuddy × ZCode</text>
  <text x="340" y="76" text-anchor="middle" font-size="14" fill="#64748B">两款国产 AI 智能体：一个管办公交付，一个管写代码</text>

  <!-- 左卡片 -->
  <g filter="url(#sh)">
    <rect x="28" y="98" width="302" height="228" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="28" y="98" width="302" height="6" rx="3" fill="url(#gWb)"/>
  </g>
  <circle cx="70" cy="142" r="21" fill="url(#gWb)"/>
  <text x="70" y="150" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">W</text>
  <text x="102" y="137" font-size="17" font-weight="700" fill="#0F172A">WorkBuddy</text>
