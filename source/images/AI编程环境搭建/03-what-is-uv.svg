<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 392" width="680" height="392" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',Arial,sans-serif">
  <defs>
    <filter id="shu" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4.5" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
    <marker id="aru" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="680" height="392" rx="18" fill="#F7F9FC"/>
  <text x="340" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">uv 是什么：一个工具，管三件事</text>
  <text x="340" y="63" text-anchor="middle" font-size="13" fill="#64748B">Rust 写的 Python 管理器，取代 pip + venv + pyenv + pipx 的组合</text>

  <!-- 输入 -->
  <g filter="url(#shu)"><rect x="20" y="88" width="112" height="112" rx="11" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <text x="76" y="116" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0F172A">你只说一句</text>
  <text x="34" y="142" font-size="9.5" font-family="Consolas,monospace" fill="#475569">uv python install</text>
  <text x="34" y="157" font-size="9.5" font-family="Consolas,monospace" fill="#475569">3.12</text>
  <text x="34" y="176" font-size="9.5" font-family="Consolas,monospace" fill="#475569">uv add requests</text>
  <text x="34" y="193" font-size="10" fill="#94A3B8">不用记细节参数</text>

  <line x1="134" y1="144" x2="150" y2="144" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#aru)"/>

  <!-- uv -->
  <g filter="url(#shu)"><rect x="152" y="88" width="112" height="112" rx="11" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/></g>
  <text x="208" y="116" text-anchor="middle" font-size="21" font-weight="700" fill="#EA580C">uv</text>
  <text x="208" y="137" text-anchor="middle" font-size="10.5" font-weight="700" fill="#B45309">统一入口</text>
  <text x="166" y="158" font-size="9.5" fill="#7C2D12">一个二进制文件</text>
  <text x="166" y="173" font-size="9.5" fill="#7C2D12">无依赖、免安装</text>
  <text x="166" y="191" font-size="9.5" fill="#7C2D12">并行下载 + 全局缓存</text>

  <line x1="266" y1="144" x2="282" y2="144" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#aru)"/>

  <!-- 产物 1 -->
  <g filter="url(#shu)"><rect x="284" y="88" width="112" height="112" rx="11" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <text x="340" y="114" text-anchor="middle" font-size="11" font-weight="700" fill="#94A3B8">它管的第 1 件</text>
  <text x="340" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Python 版本</text>
  <text x="296" y="160" font-size="9.5" fill="#475569">官方预编译构建</text>
  <text x="296" y="175" font-size="9.5" fill="#475569">多版本共存</text>
  <text x="296" y="192" font-size="10" fill="#059669">不用勾 Add to PATH</text>

  <!-- 产物 2 -->
  <g filter="url(#shu)"><rect x="416" y="88" width="112" height="112" rx="11" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <text x="472" y="114" text-anchor="middle" font-size="11" font-weight="700" fill="#94A3B8">它管的第 2 件</text>
  <text x="472" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">虚拟环境</text>
  <text x="428" y="160" font-size="9.5" fill="#475569">就是标准 .venv</text>
  <text x="428" y="175" font-size="9.5" fill="#475569">VSCode 能识别</text>
  <text x="428" y="192" font-size="10" fill="#059669">uv run 自动用它</text>

  <!-- 产物 3 -->
  <g filter="url(#shu)"><rect x="548" y="88" width="112" height="112" rx="11" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <text x="604" y="114" text-anchor="middle" font-size="11" font-weight="700" fill="#94A3B8">它管的第 3 件</text>
  <text x="604" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">依赖与锁文件</text>
  <text x="560" y="160" font-size="9.5" fill="#475569">pyproject.toml 记录</text>
  <text x="560" y="175" font-size="9.5" fill="#475569">uv.lock 锁精确版本</text>
  <text x="560" y="192" font-size="10" fill="#059669">换电脑 uv sync 复现</text>

  <!-- 优势 1 -->
  <g filter="url(#shu)"><rect x="20" y="222" width="200" height="52" rx="9" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <circle cx="42" cy="248" r="10" fill="#007ACC"/>
  <text x="42" y="252" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">1</text>
  <text x="60" y="243" font-size="11.5" font-weight="700" fill="#0F172A">快一个数量级</text>
  <text x="60" y="261" font-size="10" fill="#64748B">Rust 实现，装依赖常快 10 倍以上</text>

  <!-- 优势 2 -->
  <g filter="url(#shu)"><rect x="240" y="222" width="200" height="52" rx="9" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <circle cx="262" cy="248" r="10" fill="#007ACC"/>
  <text x="262" y="252" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">2</text>
  <text x="280" y="243" font-size="11.5" font-weight="700" fill="#0F172A">一条命令装 Python</text>
  <text x="280" y="261" font-size="10" fill="#64748B">不用下安装包、不用配 PATH</text>

  <!-- 优势 3 -->
  <g filter="url(#shu)"><rect x="460" y="222" width="200" height="52" rx="9" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <circle cx="482" cy="248" r="10" fill="#007ACC"/>
  <text x="482" y="252" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">3</text>
  <text x="500" y="243" font-size="11.5" font-weight="700" fill="#0F172A">不用手动激活环境</text>
  <text x="500" y="261" font-size="10" fill="#64748B">uv run 自动认项目的 .venv</text>

  <!-- 优势 4 -->
  <g filter="url(#shu)"><rect x="20" y="286" width="200" height="52" rx="9" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <circle cx="42" cy="312" r="10" fill="#059669"/>
  <text x="42" y="316" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">4</text>
  <text x="60" y="307" font-size="11.5" font-weight="700" fill="#0F172A">锁文件保证可复现</text>
  <text x="60" y="325" font-size="10" fill="#64748B">uv.lock + uv sync，换电脑一模一样</text>

  <!-- 优势 5 -->
  <g filter="url(#shu)"><rect x="240" y="286" width="200" height="52" rx="9" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <circle cx="262" cy="312" r="10" fill="#059669"/>
  <text x="262" y="316" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">5</text>
  <text x="280" y="307" font-size="11.5" font-weight="700" fill="#0F172A">不污染系统 Python</text>
  <text x="280" y="325" font-size="10" fill="#64748B">解释器和缓存都放你指定的目录</text>

  <!-- 优势 6 -->
  <g filter="url(#shu)"><rect x="460" y="286" width="200" height="52" rx="9" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <circle cx="482" cy="312" r="10" fill="#059669"/>
  <text x="482" y="316" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">6</text>
  <text x="500" y="307" font-size="11.5" font-weight="700" fill="#0F172A">一个工具顶四个</text>
  <text x="500" y="325" font-size="10" fill="#64748B">取代 pip + venv + pyenv + pipx</text>

  <!-- 底部说明 -->
  <rect x="20" y="352" width="640" height="28" rx="8" fill="#EEF2F7" stroke="#DCE3EC"/>
  <text x="40" y="370" font-size="11" fill="#334155">⚠️ uv 不是虚拟环境的替代品 —— 它创建的仍是标准 <tspan font-family="Consolas,monospace">.venv</tspan>，只是自动帮你建好、自动帮你用</text>
</svg>
