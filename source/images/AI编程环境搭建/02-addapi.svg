<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',Arial,sans-serif">
  <defs>
    <filter id="sh5" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
    <marker id="ar5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="680" height="300" rx="18" fill="#F7F9FC"/>
  <text x="340" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">给客户端接上 DeepSeek API：三步</text>
  <text x="340" y="68" text-anchor="middle" font-size="13" fill="#64748B">WorkBuddy 与 ZCode 的路径不同，但填的东西是同一套</text>

  <!-- Step 1 -->
  <g filter="url(#sh5)"><rect x="34" y="98" width="176" height="144" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <circle cx="58" cy="122" r="13" fill="#2563EB"/>
  <text x="58" y="127" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
  <text x="80" y="127" font-size="13.5" font-weight="700" fill="#0F172A">拿 API Key</text>
  <text x="52" y="154" font-size="11" fill="#475569">登录 DeepSeek 开放平台</text>
  <text x="52" y="173" font-size="11" fill="#475569">「API Keys → 创建新 Key」</text>
  <text x="52" y="192" font-size="11" font-weight="700" fill="#EF4444">只显示一次，立刻存好</text>
  <rect x="52" y="204" width="140" height="26" rx="6" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="122" y="221" text-anchor="middle" font-size="9.5" font-family="Consolas,monospace" fill="#1D4ED8">platform.deepseek.com</text>

  <line x1="212" y1="170" x2="248" y2="170" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar5)"/>

  <!-- Step 2 -->
  <g filter="url(#sh5)"><rect x="252" y="98" width="176" height="144" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <circle cx="276" cy="122" r="13" fill="#2563EB"/>
  <text x="276" y="127" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
  <text x="298" y="127" font-size="13.5" font-weight="700" fill="#0F172A">填进客户端</text>
  <text x="270" y="154" font-size="11" fill="#475569">设置 → 模型管理 →</text>
  <text x="270" y="173" font-size="11" fill="#475569">添加自定义供应商</text>
  <text x="270" y="192" font-size="11" fill="#475569">协议选 OpenAI 兼容</text>
  <rect x="270" y="204" width="140" height="26" rx="6" fill="#0F172A"/>
  <text x="340" y="221" text-anchor="middle" font-size="9.5" font-family="Consolas,monospace" fill="#7DD3FC">api.deepseek.com/v1</text>

  <line x1="430" y1="170" x2="466" y2="170" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar5)"/>

  <!-- Step 3 -->
  <g filter="url(#sh5)"><rect x="470" y="98" width="176" height="144" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <circle cx="494" cy="122" r="13" fill="#059669"/>
  <text x="494" y="127" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">3</text>
  <text x="516" y="127" font-size="13.5" font-weight="700" fill="#0F172A">测试并选用</text>
  <text x="488" y="154" font-size="11" fill="#475569">点「测试连接」看结果</text>
  <text x="488" y="173" font-size="11" fill="#475569">对话窗口右上角切换</text>
  <text x="488" y="192" font-size="11" fill="#475569">把它设为默认模型</text>
  <rect x="488" y="204" width="140" height="26" rx="6" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="558" y="221" text-anchor="middle" font-size="9.5" font-family="Consolas,monospace" fill="#047857">deepseek-flash</text>

  <rect x="34" y="256" width="612" height="32" rx="9" fill="#FFF7ED" stroke="#FED7AA"/>
  <text x="340" y="276" text-anchor="middle" font-size="11.5" fill="#9A3412">模型名填 deepseek-flash（V4.1 系列）；平台侧基址为 https://api.deepseek.com，客户端常需补 /v1</text>
</svg>
