<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" width="680" height="410" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',Arial,sans-serif">
  <defs>
    <marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10B981"/>
    </marker>
    <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
    </marker>
  </defs>
  <rect width="680" height="410" rx="18" fill="#F7F9FC"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">一次「采集」和一次「控制」分别发生了什么</text>
  <text x="340" y="50" text-anchor="middle" font-size="11.5" fill="#64748B">采集走后台轮询 + 推送；控制走 REST，两条链路互不阻塞</text>

  <!-- 参与者 -->
  <rect x="45" y="66" width="140" height="38" rx="9" fill="#F5F3FF" stroke="#C4B5FD"/>
  <text x="115" y="90" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6D28D9">网页前端</text>
  <rect x="195" y="66" width="140" height="38" rx="9" fill="#EFF6FF" stroke="#93C5FD"/>
  <text x="265" y="90" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1D4ED8">FastAPI 服务</text>
  <rect x="345" y="66" width="140" height="38" rx="9" fill="#ECFDF5" stroke="#6EE7B7"/>
  <text x="415" y="90" text-anchor="middle" font-size="11.5" font-weight="700" fill="#047857">采集线程</text>
  <rect x="495" y="66" width="140" height="38" rx="9" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="565" y="90" text-anchor="middle" font-size="11.5" font-weight="700" fill="#C2410C">传感器 / 模拟器</text>

  <line x1="115" y1="104" x2="115" y2="378" stroke="#CBD5E1" stroke-dasharray="5 5"/>
  <line x1="265" y1="104" x2="265" y2="378" stroke="#CBD5E1" stroke-dasharray="5 5"/>
  <line x1="415" y1="104" x2="415" y2="378" stroke="#CBD5E1" stroke-dasharray="5 5"/>
  <line x1="565" y1="104" x2="565" y2="378" stroke="#CBD5E1" stroke-dasharray="5 5"/>

  <!-- 实时采集 -->
  <rect x="34" y="112" width="614" height="14" rx="4" fill="#EEF2FF"/>
  <text x="46" y="124" font-size="9.5" font-weight="700" fill="#4338CA">实时采集：后台定时轮询，前端订阅推送</text>

  <line x1="115" y1="146" x2="259" y2="146" stroke="#3B82F6" stroke-width="1.6" marker-end="url(#arS)"/>
  <text x="187" y="141" text-anchor="middle" font-size="10" fill="#1D4ED8">① WS 连接 /ws/stream</text>

  <line x1="409" y1="172" x2="571" y2="172" stroke="#10B981" stroke-width="1.6" marker-end="url(#arG)"/>
  <text x="490" y="167" text-anchor="middle" font-size="10" fill="#047857">② 每 N 秒 FC 0x03 读寄存器</text>

  <line x1="571" y1="196" x2="409" y2="196" stroke="#10B981" stroke-width="1.6" marker-end="url(#arG)"/>
  <text x="490" y="191" text-anchor="middle" font-size="10" fill="#047857">③ 返回寄存器原始值</text>

  <line x1="409" y1="220" x2="271" y2="220" stroke="#10B981" stroke-width="1.6" marker-end="url(#arG)"/>
  <text x="340" y="215" text-anchor="middle" font-size="10" fill="#047857">④ 解码后写入缓存</text>

  <line x1="259" y1="244" x2="121" y2="244" stroke="#3B82F6" stroke-width="1.6" marker-end="url(#arS)"/>
  <text x="190" y="239" text-anchor="middle" font-size="10" fill="#1D4ED8">⑤ 广播最新快照</text>

  <!-- 分隔 -->
  <line x1="34" y1="262" x2="648" y2="262" stroke="#E2E8F0"/>
  <rect x="34" y="270" width="614" height="14" rx="4" fill="#FFF7ED"/>
  <text x="46" y="282" font-size="9.5" font-weight="700" fill="#C2410C">控制下发：走 REST，立即执行、立即回报</text>

  <line x1="115" y1="304" x2="259" y2="304" stroke="#F59E0B" stroke-width="1.6" marker-end="url(#arO)"/>
  <text x="187" y="299" text-anchor="middle" font-size="10" fill="#B45309">⑥ POST /api/alarm</text>

  <line x1="265" y1="330" x2="571" y2="330" stroke="#F59E0B" stroke-width="1.6" marker-end="url(#arO)"/>
  <text x="418" y="325" text-anchor="middle" font-size="10" fill="#B45309">⑦ 加锁 → FC 0x06 / 0x10 写寄存器（间隔 &gt;300ms）</text>

  <line x1="571" y1="356" x2="271" y2="356" stroke="#F59E0B" stroke-width="1.6" marker-end="url(#arO)"/>
  <text x="420" y="351" text-anchor="middle" font-size="10" fill="#B45309">⑧ 写入结果回报 → 前端刷新状态</text>

  <text x="340" y="398" text-anchor="middle" font-size="10" fill="#94A3B8">关键点：读和写必须共用同一把锁，否则串口会被两个线程同时占用</text>
</svg>
