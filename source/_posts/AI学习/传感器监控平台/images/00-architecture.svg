<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" height="430" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',Arial,sans-serif">
  <defs>
    <linearGradient id="gA1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#6D28D9"/></linearGradient>
    <linearGradient id="gA2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#2563EB"/></linearGradient>
    <linearGradient id="gA3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#10B981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <linearGradient id="gA4" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#D97706"/></linearGradient>
    <linearGradient id="gA5" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#EF4444"/><stop offset="100%" stop-color="#DC2626"/></linearGradient>
    <marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="680" height="430" rx="18" fill="#F7F9FC"/>

  <text x="340" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#0F172A">系统架构：从 RS485 传感器到网页</text>
  <text x="340" y="53" text-anchor="middle" font-size="12" fill="#64748B">自下而上五层，每层职责单一；右侧为旁路模拟器，没有硬件也能开发调试</text>

  <!-- 表现层 -->
  <rect x="150" y="76" width="368" height="50" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="150" y="76" width="5" height="50" rx="2.5" fill="url(#gA1)"/>
  <text x="30" y="97" font-size="11" fill="#94A3B8">表现层</text>
  <text x="30" y="113" font-size="11" fill="#94A3B8">Web UI</text>
  <text x="172" y="98" font-size="13" font-weight="700" fill="#0F172A">网页：实时数值 + 趋势曲线 + 控制按钮</text>
  <text x="172" y="116" font-size="11" fill="#64748B">原生 HTML/JS，WebSocket 接收推送，Canvas 画曲线</text>

  <line x1="334" y1="128" x2="334" y2="142" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arA)"/>

  <!-- 服务层 -->
  <rect x="150" y="144" width="368" height="50" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="150" y="144" width="5" height="50" rx="2.5" fill="url(#gA2)"/>
  <text x="30" y="165" font-size="11" fill="#94A3B8">服务层</text>
  <text x="30" y="181" font-size="11" fill="#94A3B8">FastAPI</text>
  <text x="172" y="166" font-size="13" font-weight="700" fill="#0F172A">采集调度 + 缓存 + 推送 + 控制接口</text>
  <text x="172" y="184" font-size="11" fill="#64748B">后台轮询线程 / REST 控制 / WebSocket 广播</text>

  <line x1="334" y1="196" x2="334" y2="210" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arA)"/>

  <!-- 驱动层 -->
  <rect x="150" y="212" width="368" height="50" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="150" y="212" width="5" height="50" rx="2.5" fill="url(#gA3)"/>
  <text x="30" y="233" font-size="11" fill="#94A3B8">驱动层</text>
  <text x="30" y="249" font-size="11" fill="#94A3B8">pymodbus</text>
  <text x="172" y="234" font-size="13" font-weight="700" fill="#0F172A">统一基类 + 三个传感器驱动</text>
  <text x="172" y="252" font-size="11" fill="#64748B">光照度 / 超声波 / 声光报警器，各自封装寄存器与解码</text>

  <line x1="334" y1="264" x2="334" y2="278" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arA)"/>

  <!-- 通讯层 -->
  <rect x="150" y="280" width="368" height="50" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="150" y="280" width="5" height="50" rx="2.5" fill="url(#gA4)"/>
  <text x="30" y="301" font-size="11" fill="#94A3B8">通讯层</text>
  <text x="30" y="317" font-size="11" fill="#94A3B8">RS485</text>
  <text x="172" y="302" font-size="13" font-weight="700" fill="#0F172A">串口（USB 转 RS485）+ Modbus RTU</text>
  <text x="172" y="320" font-size="11" fill="#64748B">出厂 9600/115200 · 组网统一 9600 · 8N1 · CRC16</text>

  <line x1="334" y1="332" x2="334" y2="346" stroke="#94A3B8" stroke-width="1.6" marker-end="url(#arA)"/>

  <!-- 硬件层 -->
  <rect x="150" y="348" width="368" height="56" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="150" y="348" width="5" height="56" rx="2.5" fill="url(#gA5)"/>
  <text x="30" y="372" font-size="11" fill="#94A3B8">硬件层</text>
  <text x="30" y="388" font-size="11" fill="#94A3B8">Sensors</text>
  <text x="172" y="370" font-size="10.5" fill="#0F172A">JXBS-3001-GZ 光照度 ｜ DYP-A22 超声波 ｜ RS485 声光报警器</text>
  <text x="172" y="388" font-size="10.5" fill="#64748B">挂在同一条 485 总线上，靠不同从机地址区分（地址不能冲突）</text>

  <!-- 模拟器旁路 -->
  <rect x="532" y="216" width="120" height="112" rx="10" fill="#F5F3FF" stroke="#C4B5FD" stroke-dasharray="5 4"/>
  <text x="592" y="238" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6D28D9">本地模拟器</text>
  <text x="592" y="256" text-anchor="middle" font-size="10" fill="#7C3AED">Modbus TCP</text>
  <text x="592" y="273" text-anchor="middle" font-size="10" fill="#7C3AED">127.0.0.1:5020</text>
  <text x="592" y="296" text-anchor="middle" font-size="9.5" fill="#8B5CF6">驱动代码不用改</text>
  <text x="592" y="311" text-anchor="middle" font-size="9.5" fill="#8B5CF6">换传输方式即可</text>
  <line x1="530" y1="272" x2="522" y2="272" stroke="#8B5CF6" stroke-width="1.4" stroke-dasharray="4 3"/>
</svg>
