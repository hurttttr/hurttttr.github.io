<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',Arial,sans-serif">
  <defs>
    <linearGradient id="pfA" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#60A5FA"/><stop offset="100%" stop-color="#2563EB"/></linearGradient>
    <linearGradient id="pfB" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#A78BFA"/><stop offset="100%" stop-color="#7C3AED"/></linearGradient>
    <linearGradient id="pfC" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#34D399"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <linearGradient id="pfD" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FBBF24"/><stop offset="100%" stop-color="#D97706"/></linearGradient>
  </defs>
  <rect width="680" height="400" rx="18" fill="#F7F9FC"/>
  <text x="340" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">从接口文档到驱动代码：四步走</text>
  <text x="340" y="53" text-anchor="middle" font-size="11.5" fill="#64748B">寄存器地址、换算公式、特殊值——一律来自厂商文档，不来自记忆</text>

  <!-- 卡片 1 -->
  <rect x="38" y="78" width="140" height="152" rx="10" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
  <rect x="38" y="78" width="140" height="34" rx="10" fill="url(#pfA)"/>
  <rect x="38" y="102" width="140" height="10" fill="url(#pfA)"/>
  <text x="108" y="100" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">① 找齐文档</text>
  <text x="56" y="132" font-size="10.5" fill="#334155">3 份厂商接口文档</text>
  <text x="56" y="152" font-size="10.5" fill="#334155">.doc 与 .pdf 混排</text>
  <text x="56" y="172" font-size="10.5" fill="#334155">随附在交付包里</text>
  <rect x="54" y="188" width="108" height="28" rx="7" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="108" y="206" text-anchor="middle" font-size="9.5" fill="#1E40AF">先确认路径存在</text>

  <!-- 箭头 1->2 -->
  <polygon points="180,142 196,152 180,162" fill="#94A3B8"/>

  <!-- 卡片 2 -->
  <rect x="198" y="78" width="140" height="152" rx="10" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5"/>
  <rect x="198" y="78" width="140" height="34" rx="10" fill="url(#pfB)"/>
  <rect x="198" y="102" width="140" height="10" fill="url(#pfB)"/>
  <text x="268" y="100" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">② 逐份读原文</text>
  <text x="216" y="132" font-size="10.5" fill="#334155">解析 OLE / PDF</text>
  <text x="216" y="152" font-size="10.5" fill="#334155">真的把文件读开</text>
  <text x="216" y="172" font-size="10.5" fill="#334155">禁止凭记忆推测</text>
  <rect x="214" y="188" width="108" height="28" rx="7" fill="#F5F3FF" stroke="#DDD6FE"/>
  <text x="268" y="206" text-anchor="middle" font-size="9.5" fill="#5B21B6">读不出就明说</text>

  <!-- 箭头 2->3 -->
  <polygon points="340,142 356,152 340,162" fill="#94A3B8"/>

  <!-- 卡片 3 -->
  <rect x="358" y="78" width="140" height="152" rx="10" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.5"/>
  <rect x="358" y="78" width="140" height="34" rx="10" fill="url(#pfC)"/>
  <rect x="358" y="102" width="140" height="10" fill="url(#pfC)"/>
  <text x="428" y="100" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">③ 写协议摘要</text>
  <text x="376" y="132" font-size="10.5" fill="#334155">docs/protocol.md</text>
  <text x="376" y="152" font-size="10.5" fill="#334155">寄存器表 + 换算公式</text>
  <text x="376" y="172" font-size="10.5" fill="#334155">特殊值 + 出厂默认值</text>
  <rect x="374" y="188" width="108" height="28" rx="7" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="428" y="206" text-anchor="middle" font-size="9.5" fill="#065F46">含官方读值样例</text>

  <!-- 箭头 3->4 -->
  <polygon points="500,142 516,152 500,162" fill="#94A3B8"/>

  <!-- 卡片 4 -->
  <rect x="518" y="78" width="140" height="152" rx="10" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.5"/>
  <rect x="518" y="78" width="140" height="34" rx="10" fill="url(#pfD)"/>
  <rect x="518" y="102" width="140" height="10" fill="url(#pfD)"/>
  <text x="588" y="100" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">④ 核对后放行</text>
  <text x="536" y="132" font-size="10.5" fill="#334155">拿官方样例对答案</text>
  <text x="536" y="152" font-size="10.5" fill="#334155">人工确认这一步</text>
  <text x="536" y="172" font-size="10.5" fill="#334155">确认后才写代码</text>
  <rect x="534" y="188" width="108" height="28" rx="7" fill="#FFFBEB" stroke="#FDE68A"/>
  <text x="588" y="206" text-anchor="middle" font-size="9.5" fill="#92400E">这是硬闸门</text>

  <!-- 下方说明条 -->
  <rect x="38" y="252" width="620" height="60" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="58" y="274" font-size="11.5" font-weight="700" fill="#0F172A">驱动代码里不该出现「来历不明的数字」</text>
  <text x="58" y="296" font-size="10.5" fill="#475569">每个寄存器常量旁边都要有注释指出出处：来自哪份文档、摘要里的哪一行。</text>

  <!-- 警示条 -->
  <rect x="38" y="326" width="620" height="56" rx="10" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="58" y="348" font-size="11.5" font-weight="700" fill="#991B1B">⚠️ 为什么第 4 步不能省</text>
  <text x="58" y="370" font-size="10.5" fill="#991B1B">摘要读错 → 模拟器按错的寄存器表响应 → 驱动测试全绿、接上真机全挂，而且极难排查。</text>
</svg>
