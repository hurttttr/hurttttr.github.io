<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" width="680" height="460" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',Arial,sans-serif">
  <rect width="680" height="460" rx="18" fill="#F7F9FC"/>
  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">网页长什么样：一屏搞定「看数据 + 按按钮」</text>
  <text x="340" y="50" text-anchor="middle" font-size="11.5" fill="#64748B">单文件 index.html，不依赖任何 CDN，断网也能用</text>

  <!-- 浏览器窗口 -->
  <rect x="40" y="64" width="600" height="380" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
  <rect x="40" y="64" width="600" height="26" rx="12" fill="#F1F5F9"/>
  <rect x="40" y="78" width="600" height="12" fill="#F1F5F9"/>
  <circle cx="58" cy="77" r="4" fill="#EF4444"/>
  <circle cx="72" cy="77" r="4" fill="#F59E0B"/>
  <circle cx="86" cy="77" r="4" fill="#10B981"/>
  <rect x="110" y="70" width="300" height="14" rx="7" fill="#E2E8F0"/>
  <text x="120" y="81" font-size="9" font-family="Consolas,monospace" fill="#64748B">http://127.0.0.1:8000/</text>

  <!-- 顶栏 -->
  <text x="60" y="114" font-size="13.5" font-weight="700" fill="#0F172A">传感器监控台</text>
  <circle cx="353" cy="110" r="4.5" fill="#10B981"/>
  <text x="365" y="114" font-size="10.5" fill="#059669">已连接 · 模拟器 127.0.0.1:5020</text>
  <text x="620" y="114" text-anchor="end" font-size="9.5" fill="#94A3B8">上次更新 1s 前</text>
  <line x1="60" y1="124" x2="620" y2="124" stroke="#E2E8F0"/>

  <!-- 指标卡 -->
  <rect x="60" y="136" width="176" height="72" rx="9" fill="#FFFBEB" stroke="#FDE68A"/>
  <text x="74" y="155" font-size="10" fill="#92400E">光照度</text>
  <text x="74" y="185" font-size="22" font-weight="700" fill="#B45309">132854</text>
  <text x="176" y="185" font-size="11" fill="#B45309">Lux</text>
  <text x="74" y="200" font-size="9" fill="#B45309">0x0007+08 · uint32</text>

  <rect x="252" y="136" width="176" height="72" rx="9" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="266" y="155" font-size="10" fill="#1E40AF">距离（处理值）</text>
  <text x="266" y="185" font-size="22" font-weight="700" fill="#1D4ED8">754</text>
  <text x="336" y="185" font-size="11" fill="#1D4ED8">mm</text>
  <text x="266" y="200" font-size="9" fill="#1D4ED8">0x0100 · 实时 0x0101</text>

  <rect x="444" y="136" width="176" height="72" rx="9" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="458" y="155" font-size="10" fill="#166534">环境温度</text>
  <text x="458" y="185" font-size="22" font-weight="700" fill="#15803D">30.0</text>
  <text x="518" y="185" font-size="11" fill="#15803D">℃</text>
  <text x="458" y="200" font-size="9" fill="#15803D">0x0102 · ×0.1</text>

  <!-- 曲线区 -->
  <rect x="60" y="220" width="560" height="118" rx="9" fill="#FCFCFD" stroke="#E2E8F0"/>
  <line x1="60" y1="250" x2="620" y2="250" stroke="#F1F5F9"/>
  <line x1="60" y1="280" x2="620" y2="280" stroke="#F1F5F9"/>
  <line x1="60" y1="310" x2="620" y2="310" stroke="#F1F5F9"/>
  <polyline points="80,312 130,300 180,306 230,288 280,292 330,276 380,284 430,268 480,274 530,258 580,264 610,256"
            fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linejoin="round"/>
  <polyline points="80,326 130,322 180,328 230,318 280,324 330,314 380,320 430,310 480,316 530,306 580,312 610,304"
            fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="72" y="236" font-size="9.5" font-weight="700" fill="#334155">近 60 秒趋势</text>
  <text x="612" y="236" text-anchor="end" font-size="9" fill="#2563EB">— 距离(mm)</text>
  <text x="612" y="248" text-anchor="end" font-size="9" fill="#D97706">-- 光照(/100)</text>

  <!-- 控制面板 -->
  <rect x="60" y="348" width="560" height="80" rx="9" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="74" y="367" font-size="10.5" font-weight="700" fill="#991B1B">声光报警器控制</text>
  <text x="612" y="367" text-anchor="end" font-size="9" fill="#B91C1C">写寄存器间隔 &gt;300ms</text>

  <rect x="74" y="378" width="96" height="30" rx="6" fill="#FFFFFF" stroke="#FCA5A5"/>
  <text x="122" y="397" text-anchor="middle" font-size="10.5" fill="#991B1B">声音：开</text>

  <rect x="180" y="378" width="96" height="30" rx="6" fill="#FFFFFF" stroke="#FCA5A5"/>
  <text x="228" y="397" text-anchor="middle" font-size="10.5" fill="#991B1B">灯光：开</text>

  <rect x="286" y="378" width="126" height="30" rx="6" fill="#FFFFFF" stroke="#FCA5A5"/>
  <text x="296" y="397" font-size="10.5" fill="#991B1B">音量</text>
  <line x1="330" y1="393" x2="396" y2="393" stroke="#FECACA" stroke-width="4" stroke-linecap="round"/>
  <line x1="330" y1="393" x2="378" y2="393" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>
  <circle cx="378" cy="393" r="6" fill="#FFFFFF" stroke="#EF4444" stroke-width="2"/>
  <text x="402" y="397" font-size="9" fill="#B91C1C">24</text>

  <rect x="422" y="378" width="90" height="30" rx="6" fill="#FFFFFF" stroke="#FCA5A5"/>
  <text x="467" y="397" text-anchor="middle" font-size="10.5" fill="#991B1B">曲目 1-1 ▾</text>

  <rect x="522" y="378" width="90" height="30" rx="6" fill="#EF4444"/>
  <text x="567" y="397" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">立即触发</text>

  <text x="340" y="450" text-anchor="middle" font-size="9.5" fill="#94A3B8">上方数值来自 WebSocket 推送；下方按钮直接调用 REST 接口，改完立刻反映到设备</text>
</svg>
