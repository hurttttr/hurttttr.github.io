<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',Arial,sans-serif">
  <defs>
    <linearGradient id="rbHost" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#60A5FA"/><stop offset="100%" stop-color="#2563EB"/></linearGradient>
    <linearGradient id="rbConv" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#A78BFA"/><stop offset="100%" stop-color="#7C3AED"/></linearGradient>
  </defs>
  <rect width="680" height="400" rx="18" fill="#F7F9FC"/>
  <text x="340" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#0F172A">RS485 一主多从：主机点名，从机才回答</text>
  <text x="340" y="50" text-anchor="middle" font-size="11" fill="#64748B">两根线 A / B 传差分信号 · 半双工 · 同一时刻只有一个设备能发言</text>

  <!-- 主机 -->
  <rect x="20" y="72" width="118" height="56" rx="9" fill="url(#rbHost)"/>
  <text x="79" y="96" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">电脑（主机）</text>
  <text x="79" y="115" text-anchor="middle" font-size="9.5" fill="#DBEAFE">轮流点名 + 收数据</text>

  <polygon points="142,92 158,100 142,108" fill="#94A3B8"/>
  <polygon points="156,92 172,100 156,108" fill="#CBD5E1"/>

  <!-- 转换器 -->
  <rect x="176" y="72" width="106" height="56" rx="9" fill="url(#rbConv)"/>
  <text x="229" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">USB 转 485</text>
  <text x="229" y="115" text-anchor="middle" font-size="9.5" fill="#EDE9FE">COM 口</text>

  <!-- 总线 A / B -->
  <text x="292" y="88" text-anchor="end" font-size="10" font-weight="700" fill="#0F766E">A</text>
  <text x="292" y="106" text-anchor="end" font-size="10" font-weight="700" fill="#0F766E">B</text>
  <line x1="296" y1="84" x2="660" y2="84" stroke="#14B8A6" stroke-width="2.4"/>
  <line x1="296" y1="102" x2="660" y2="102" stroke="#0D9488" stroke-width="2.4"/>
  <text x="614" y="76" text-anchor="end" font-size="9.5" fill="#0F766E">差分信号，抗干扰</text>

  <!-- 从机支线 -->
  <line x1="360" y1="102" x2="360" y2="150" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="3 3"/>
  <line x1="480" y1="102" x2="480" y2="150" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="3 3"/>
  <line x1="600" y1="102" x2="600" y2="150" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="3 3"/>

  <!-- 从机 1 -->
  <rect x="317" y="150" width="86" height="56" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="360" y="172" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">光照度</text>
  <text x="360" y="190" text-anchor="middle" font-size="9.5" fill="#64748B">地址 1 · 静默</text>

  <!-- 从机 2（被点名，高亮） -->
  <rect x="437" y="150" width="86" height="56" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="480" y="172" text-anchor="middle" font-size="11" font-weight="700" fill="#065F46">超声波</text>
  <text x="480" y="190" text-anchor="middle" font-size="9.5" fill="#047857">地址 2 · 应答</text>
  <polygon points="474,144 480,132 486,144" fill="#059669"/>
  <text x="537" y="140" font-size="9.5" font-weight="700" fill="#047857">← 只有它回话</text>

  <!-- 从机 3 -->
  <rect x="557" y="150" width="86" height="56" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="600" y="172" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">报警器</text>
  <text x="600" y="190" text-anchor="middle" font-size="9.5" fill="#64748B">地址 3 · 静默</text>

  <!-- 帧结构条 -->
  <rect x="20" y="222" width="640" height="46" rx="9" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="34" y="251" font-size="11" font-weight="700" fill="#0F172A">点名帧：</text>
  <rect x="94" y="234" width="96" height="22" rx="5" fill="#DBEAFE"/>
  <text x="142" y="250" text-anchor="middle" font-size="9.5" fill="#1E40AF">从机地址</text>
  <rect x="194" y="234" width="82" height="22" rx="5" fill="#E0E7FF"/>
  <text x="235" y="250" text-anchor="middle" font-size="9.5" fill="#3730A3">功能码</text>
  <rect x="280" y="234" width="82" height="22" rx="5" fill="#F1F5F9"/>
  <text x="321" y="250" text-anchor="middle" font-size="9.5" fill="#334155">数据</text>
  <rect x="366" y="234" width="62" height="22" rx="5" fill="#FEF3C7"/>
  <text x="397" y="250" text-anchor="middle" font-size="9.5" fill="#92400E">CRC</text>
  <text x="442" y="251" font-size="10.5" fill="#64748B">整条总线都收到，地址对得上的那台才回应</text>

  <!-- 三个必须 -->
  <rect x="20" y="282" width="204" height="100" rx="10" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="122" y="306" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1D4ED8">① 地址必须唯一</text>
  <text x="36" y="330" font-size="10" fill="#475569">两台地址相同 → 一起应答</text>
  <text x="36" y="349" font-size="10" fill="#475569">信号在线上「顶牛」</text>
  <text x="36" y="368" font-size="10" font-weight="700" fill="#B91C1C">表现为偶发 CRC 错（最难查）</text>

  <rect x="238" y="282" width="204" height="100" rx="10" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5"/>
  <text x="340" y="306" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6D28D9">② 通讯参数必须一致</text>
  <text x="254" y="330" font-size="10" fill="#475569">波特率 / 数据位 / 校验位</text>
  <text x="254" y="349" font-size="10" fill="#475569">/ 停止位，四项全都要一样</text>
  <text x="254" y="368" font-size="10" font-weight="700" fill="#B91C1C">不一致 = 全是乱码</text>

  <rect x="456" y="282" width="204" height="100" rx="10" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.5"/>
  <text x="558" y="306" text-anchor="middle" font-size="11.5" font-weight="700" fill="#047857">③ 同时只能一个发言</text>
  <text x="472" y="330" font-size="10" fill="#475569">半双工，主机也得排队</text>
  <text x="472" y="349" font-size="10" fill="#475569">所以采集要串行，别并发写</text>
  <text x="472" y="368" font-size="10" font-weight="700" fill="#047857">驱动层要共用一把锁</text>
</svg>
