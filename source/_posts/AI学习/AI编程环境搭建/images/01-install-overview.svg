<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',Arial,sans-serif">
  <defs>
    <filter id="sh1" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
    <marker id="ar1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="680" height="320" rx="18" fill="#F7F9FC"/>
  <text x="340" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">第 1 篇要装的三样东西</text>
  <text x="340" y="66" text-anchor="middle" font-size="13" fill="#64748B">全程图形界面，一路「下一步」，不需要命令行</text>

  <!-- Step 1 -->
  <g filter="url(#sh1)"><rect x="24" y="92" width="190" height="150" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <circle cx="52" cy="120" r="13" fill="#007ACC"/>
  <text x="52" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
  <text x="74" y="125" font-size="14" font-weight="700" fill="#0F172A">VSCode</text>
  <text x="44" y="152" font-size="11.5" font-weight="700" fill="#007ACC">写代码的编辑器</text>
  <text x="44" y="174" font-size="11" fill="#475569">官网 code.visualstudio.com</text>
  <text x="44" y="193" font-size="11" fill="#475569">下载 .exe → 一路下一步</text>
  <text x="44" y="212" font-size="11" fill="#475569">勾选「添加到 PATH」</text>
  <text x="44" y="231" font-size="10.5" fill="#059669">免费 · 微软官方</text>

  <line x1="216" y1="167" x2="232" y2="167" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar1)"/>

  <!-- Step 2 -->
  <g filter="url(#sh1)"><rect x="234" y="92" width="190" height="150" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <circle cx="262" cy="120" r="13" fill="#007ACC"/>
  <text x="262" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
  <text x="284" y="125" font-size="14" font-weight="700" fill="#0F172A">中文语言包</text>
  <text x="254" y="152" font-size="11.5" font-weight="700" fill="#007ACC">把界面换成中文</text>
  <text x="254" y="174" font-size="11" fill="#475569">Ctrl+Shift+X 搜 Chinese</text>
  <rect x="237" y="183" width="184" height="20" rx="5" fill="#2563EB"/>
  <text x="329" y="196.5" text-anchor="middle" font-size="9.5" font-family="Consolas,monospace" font-weight="700" fill="#FFFFFF" textLength="172" lengthAdjust="spacingAndGlyphs">Chinese (Simplified) Language Pack</text>
  <text x="254" y="218" font-size="11" fill="#475569">发布者须是 Microsoft</text>
  <text x="254" y="234" font-size="10.5" fill="#059669">安装后重启即生效</text>

  <line x1="426" y1="167" x2="442" y2="167" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar1)"/>

  <!-- Step 3 -->
  <g filter="url(#sh1)"><rect x="444" y="92" width="212" height="150" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <circle cx="472" cy="120" r="13" fill="#F59E0B"/>
  <text x="472" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">3</text>
  <text x="494" y="125" font-size="14" font-weight="700" fill="#0F172A">WorkBuddy</text>
  <text x="464" y="152" font-size="11.5" font-weight="700" fill="#B45309">帮你干活的 AI 智能体</text>
  <text x="464" y="174" font-size="11" fill="#475569">官网 codebuddy.cn/work</text>
  <text x="464" y="193" font-size="11" fill="#475569">微信 / QQ 扫码登录</text>
  <text x="464" y="212" font-size="11" fill="#B45309">⭐ 登录后立刻领免费积分</text>
  <text x="464" y="231" font-size="10.5" fill="#64748B">第 3、5 篇的环境全靠它</text>

  <!-- Bottom note -->
  <rect x="24" y="256" width="632" height="44" rx="10" fill="#EEF2F7" stroke="#DCE3EC"/>
  <text x="44" y="277" font-size="12" font-weight="700" fill="#334155">Python 环境不在本篇装 —— 第 1 篇只讲清「装什么、为什么」，</text>
  <text x="44" y="293" font-size="12" font-weight="700" fill="#007ACC">第 3 篇再交给 WorkBuddy 一条提示词自动搞定（uv + Python 3.12）</text>
</svg>
