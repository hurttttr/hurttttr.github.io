<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',Arial,sans-serif">
  <rect width="680" height="320" rx="18" fill="#F7F9FC"/>
  <text x="340" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#0F172A">跑通第一个程序：终端里应该看到这样的输出</text>

  <!-- 终端窗口 -->
  <g>
    <rect x="40" y="60" width="600" height="228" rx="10" fill="#0F172A"/>
    <rect x="40" y="60" width="600" height="30" rx="10" fill="#1E293B"/>
    <rect x="40" y="78" width="600" height="12" fill="#1E293B"/>
    <circle cx="60" cy="75" r="5" fill="#EF4444"/>
    <circle cx="78" cy="75" r="5" fill="#F59E0B"/>
    <circle cx="96" cy="75" r="5" fill="#10B981"/>
    <text x="340" y="80" text-anchor="middle" font-size="11" font-family="Consolas,monospace" fill="#94A3B8">PowerShell — D:\Code\demo</text>
  </g>

  <g font-family="Consolas,'Cascadia Mono',monospace" font-size="12.5">
    <text x="62" y="116" fill="#64748B">PS D:\Code\demo&gt; <tspan fill="#E2E8F0">uv venv --python 3.12</tspan></text>
    <text x="62" y="140" fill="#7DD3FC">Using CPython 3.12.13 interpreter at: ...\cpython-3.12.13\python.exe</text>
    <text x="62" y="162" fill="#7DD3FC">Creating virtual environment at: .venv</text>

    <text x="62" y="198" fill="#64748B">PS D:\Code\demo&gt; <tspan fill="#E2E8F0">uv run hello_world.py</tspan></text>
    <text x="62" y="226" fill="#6EE7B7" font-size="14" font-weight="700">Hello, World!</text>

    <text x="62" y="262" fill="#64748B">PS D:\Code\demo&gt; <tspan fill="#E2E8F0">_</tspan></text>
  </g>

  <text x="340" y="308" text-anchor="middle" font-size="11.5" fill="#94A3B8">看到这一行绿字，说明 uv + Python + 虚拟环境 + VSCode 这条链路已经全部打通</text>
</svg>
