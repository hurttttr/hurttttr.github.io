<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" width="680" height="310" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',Arial,sans-serif">
  <defs>
    <filter id="sh3" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="680" height="310" rx="18" fill="#F7F9FC"/>
  <text x="340" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">uv 环境搭建：四步走完</text>
  <text x="340" y="68" text-anchor="middle" font-size="13" fill="#64748B">装好 uv 与 Python 3.12；建项目、跑代码在第 4 篇完成</text>

  <!-- Step 1 -->
  <g filter="url(#sh3)"><rect x="29" y="104" width="142" height="126" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <circle cx="52" cy="128" r="13" fill="#2563EB"/>
  <text x="52" y="133" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
  <text x="74" y="133" font-size="13.5" font-weight="700" fill="#0F172A">装 uv</text>
  <text x="45" y="160" font-size="10.5" fill="#475569">PowerShell 一条命令</text>
  <rect x="41" y="170" width="118" height="44" rx="7" fill="#0F172A"/>
  <text x="100" y="188" text-anchor="middle" font-size="8.5" font-family="Consolas,monospace" fill="#7DD3FC">irm astral.sh/uv/</text>
  <text x="100" y="203" text-anchor="middle" font-size="8.5" font-family="Consolas,monospace" fill="#7DD3FC">install.ps1 | iex</text>

  <line x1="173" y1="167" x2="189" y2="167" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Step 2 -->
  <g filter="url(#sh3)"><rect x="191" y="104" width="142" height="126" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <circle cx="214" cy="128" r="13" fill="#2563EB"/>
  <text x="214" y="133" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
  <text x="236" y="133" font-size="13.5" font-weight="700" fill="#0F172A">配环境变量</text>
  <text x="207" y="160" font-size="10.5" fill="#475569">指定 Python 与缓存目录</text>
  <rect x="203" y="170" width="118" height="44" rx="7" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="262" y="188" text-anchor="middle" font-size="8.5" font-family="Consolas,monospace" fill="#1D4ED8">UV_PYTHON_INSTALL</text>
  <text x="262" y="203" text-anchor="middle" font-size="8.5" font-family="Consolas,monospace" fill="#1D4ED8">_DIR / UV_CACHE_DIR</text>

  <line x1="335" y1="167" x2="351" y2="167" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Step 3 -->
  <g filter="url(#sh3)"><rect x="353" y="104" width="142" height="126" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <circle cx="376" cy="128" r="13" fill="#2563EB"/>
  <text x="376" y="133" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">3</text>
  <text x="398" y="133" font-size="13.5" font-weight="700" fill="#0F172A">装 Python</text>
  <text x="369" y="160" font-size="10.5" fill="#475569">uv 自动下载解释器</text>
  <rect x="365" y="170" width="118" height="44" rx="7" fill="#0F172A"/>
  <text x="424" y="188" text-anchor="middle" font-size="9.5" font-family="Consolas,monospace" fill="#7DD3FC">uv python</text>
  <text x="424" y="203" text-anchor="middle" font-size="9.5" font-family="Consolas,monospace" fill="#7DD3FC">install 3.12</text>

  <line x1="497" y1="167" x2="513" y2="167" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Step 4 -->
  <g filter="url(#sh3)"><rect x="515" y="104" width="142" height="126" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <circle cx="538" cy="128" r="13" fill="#059669"/>
  <text x="538" y="133" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">4</text>
  <text x="560" y="133" font-size="13.5" font-weight="700" fill="#0F172A">验证解释器</text>
  <text x="531" y="160" font-size="10.5" fill="#475569">列出已装版本，确认可用</text>
  <rect x="527" y="170" width="118" height="44" rx="7" fill="#0F172A"/>
  <text x="586" y="188" text-anchor="middle" font-size="8.5" font-family="Consolas,monospace" fill="#6EE7B7">uv python list</text>
  <text x="586" y="203" text-anchor="middle" font-size="8.5" font-family="Consolas,monospace" fill="#6EE7B7">--only-installed</text>

  <!-- 底部 -->
  <rect x="29" y="248" width="628" height="42" rx="10" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="343" y="267" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">为什么用 uv？把「装 Python → 装 pip → 建 venv → 装依赖」压缩成一条命令</text>
  <text x="343" y="284" text-anchor="middle" font-size="11" fill="#166534">速度比 pip 快一个数量级，换电脑只需重跑一遍</text>
</svg>
