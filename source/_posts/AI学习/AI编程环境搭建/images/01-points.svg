<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',Arial,sans-serif">
  <defs>
    <filter id="sh2" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="680" height="330" rx="18" fill="#F7F9FC"/>

  <text x="340" y="44" text-anchor="middle" font-size="21" font-weight="700" fill="#0F172A">WorkBuddy 免费积分：四条路都领一遍</text>
  <text x="340" y="68" text-anchor="middle" font-size="13" fill="#64748B">积分就是「运行任务的燃料」，白送的别浪费</text>

  <!-- 卡片 1 -->
  <g filter="url(#sh2)"><rect x="33" y="92" width="143" height="158" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <rect x="33" y="92" width="143" height="40" rx="12" fill="#2563EB"/>
  <rect x="33" y="120" width="143" height="12" fill="#2563EB"/>
  <text x="104" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">2800~5000</text>
  <text x="104" y="156" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F172A">新人礼包</text>
  <text x="104" y="182" text-anchor="middle" font-size="11" fill="#64748B">登录后到</text>
  <text x="104" y="199" text-anchor="middle" font-size="11" fill="#64748B">「头像 → 个人中心」</text>
  <text x="104" y="216" text-anchor="middle" font-size="11" fill="#64748B">手动点领取</text>
  <text x="104" y="238" text-anchor="middle" font-size="10.5" font-weight="700" fill="#EF4444">有效期约 90 天</text>

  <!-- 卡片 2 -->
  <g filter="url(#sh2)"><rect x="190" y="92" width="143" height="158" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <rect x="190" y="92" width="143" height="40" rx="12" fill="#0EA5E9"/>
  <rect x="190" y="120" width="143" height="12" fill="#0EA5E9"/>
  <text x="261" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">500 / 月</text>
  <text x="261" y="156" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F172A">每月固定</text>
  <text x="261" y="182" text-anchor="middle" font-size="11" fill="#64748B">每月 1 日</text>
  <text x="261" y="199" text-anchor="middle" font-size="11" fill="#64748B">自动到账</text>
  <text x="261" y="216" text-anchor="middle" font-size="11" fill="#64748B">无需操作</text>
  <text x="261" y="238" text-anchor="middle" font-size="10.5" font-weight="700" fill="#059669">永久有效</text>

  <!-- 卡片 3 -->
  <g filter="url(#sh2)"><rect x="347" y="92" width="143" height="158" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <rect x="347" y="92" width="143" height="40" rx="12" fill="#10B981"/>
  <rect x="347" y="120" width="143" height="12" fill="#10B981"/>
  <text x="418" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">≈100~150 / 天</text>
  <text x="418" y="156" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F172A">每日签到</text>
  <text x="418" y="182" text-anchor="middle" font-size="11" fill="#64748B">「头像 → 今日礼包」</text>
  <text x="418" y="199" text-anchor="middle" font-size="11" fill="#64748B">点一下即到账</text>
  <text x="418" y="216" text-anchor="middle" font-size="11" fill="#64748B">坚持就有</text>
  <text x="418" y="238" text-anchor="middle" font-size="10.5" font-weight="700" fill="#059669">连续 7 天有加成</text>

  <!-- 卡片 4 -->
  <g filter="url(#sh2)"><rect x="504" y="92" width="143" height="158" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/></g>
  <rect x="504" y="92" width="143" height="40" rx="12" fill="#8B5CF6"/>
  <rect x="504" y="120" width="143" height="12" fill="#8B5CF6"/>
  <text x="575" y="120" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">900 一次性</text>
  <text x="575" y="156" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0F172A">成长计划</text>
  <text x="575" y="182" text-anchor="middle" font-size="11" fill="#64748B">「个人中心 →</text>
  <text x="575" y="199" text-anchor="middle" font-size="11" fill="#64748B">成长计划」</text>
  <text x="575" y="216" text-anchor="middle" font-size="11" fill="#64748B">做任务领积分</text>
  <text x="575" y="238" text-anchor="middle" font-size="10.5" font-weight="700" fill="#059669">首次对话也算任务</text>

  <!-- 底部提示 -->
  <rect x="33" y="266" width="614" height="44" rx="10" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="340" y="286" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3730A3">积分还不够？去腾讯云开发者社区发文</text>
  <text x="340" y="303" text-anchor="middle" font-size="12" fill="#4338CA">心得 500 分/篇　·　教程 1000 分/篇　·　被官方精选再 +2000 分</text>
</svg>
